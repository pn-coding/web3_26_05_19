<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .wrap{
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .loading_wrap{
            width: 100%;
            height: 100vh;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
        }

        .loading{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 10px solid slateblue;
            border-color: slateblue transparent transparent transparent;
            animation: loading_ani 1s infinite;
        }

        @keyframes loading_ani {
            0%{
                transform: rotate(0);
            }
            100%{
                transform: rotate(360deg);
            }
        }

        .active{
            display: none;
        }

    </style>

</head>
<body>
    
    <div class="wrap">

        <h1>메인페이지</h1>

        <div class="loading_wrap">
            <div class="loading"></div>
        </div>

    </div>

    <script>

        const loadingWrapEl = document.querySelector('.loading_wrap');

        setTimeout(() => {
            // loadingWrapEl.style.display = "none";
            loadingWrapEl.classList.add('active');
        }, 2000);

    </script>

</body>
</html>
