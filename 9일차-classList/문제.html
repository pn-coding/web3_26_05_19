<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .con_wrap{
            max-width: 500px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin:  100px auto;
            padding: 0 20px;
        }

        .con{
            width: 120px;
            height: 120px;
            background-color: gray;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            border-radius: 50%;
        }

        @keyframes motion {
            0%{
                transform: scale(1);
            }
            50%{
                transform: scale(0.5);
            }
            75%{
                transform: scale(1.2);
            }
            100%{
                border-top-right-radius: 0;
                transform: scale(1);
                background-color: gold;
            }
        }
    
        .active{
            animation: motion 0.5s 1 forwards;
        }

    </style>
</head>
<body>
    
    <div class="con_wrap">
        <div class="con">1</div>
        <div class="con">2</div>
        <div class="con">3</div>
    </div>

    <script>

        const conAll = document.querySelectorAll('.con');

        for(let i = 0; i < conAll.length; i++){
            const clickHandler = () => {
                conAll[i].classList.toggle('active');
            }

            conAll[i].addEventListener('click', clickHandler);
        }

    </script>

</body>
</html>
