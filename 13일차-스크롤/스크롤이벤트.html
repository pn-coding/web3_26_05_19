<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        header{
            width: 100%;
            height: 80px;
            font-size: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
        }

        .header_active{
            background-color: rgba(0,0,0,0.7);
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10;
        }

        section{
            height: 100vh;
            border: 2px solid red;
        }

        .section_1{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            background-color: lightgray;
        }

        .section_2{
            padding: 150px 250px;
        }

        .title_2{
            font-size: 50px;
        }

        .con_wrap{
            display: flex;
            justify-content: space-between;
        }

        .con{
            width: 32%;
            height: 500px;
            background-color: lightgray;
            transform: translateY(200px);
            opacity: 0;
            transition: 0.5s;
        }

        .con:nth-child(2){
            transition-duration: 1s;
        }

        .con:nth-child(3){
            transition-duration: 1.5s;
        }

        .con_active{
            transform: translateY(0);
            opacity: 1;
        }

        .section_3{
            height: 500px;
            background-color: lightgray;
            font-size: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

    </style>

</head>
<body>
    
    <div class="wrap">

        <header>
            <h3>Header</h3>
        </header>

        <section class="section_1">
            <h3 class="title_1">Title</h3>
            <h3 class="title_1">Section One</h3>
        </section>

        <section class="section_2">
            <h3 class="title_2">Title2</h3>

            <div class="con_wrap">
                <div class="con con_1"></div>
                <div class="con con_2"></div>
                <div class="con con_3"></div>
            </div>
        </section>

        <section class="section_3">
            <h3>Section Three</h3>
        </section>

    </div>

    
    <script>

        const headerEl = document.querySelector('header');
        const conAll = document.querySelectorAll('.con');
        const sec_2 = document.querySelector('.section_2');


        const handleScroll = () => {
            // console.log('스크롤 작동함');

            const pageY = pageYOffset;
            // =>스크롤 바의 높이를 가져옴
            console.log(pageY);
            const sec_2_top = sec_2.offsetTop;
            // =>선택자의 top 값을 px단위로 가져옴

            if(pageY >= 300){
                headerEl.classList.add('header_active');
            }else{
                headerEl.classList.remove('header_active');
            }
            // header scroll end

            if(pageY > sec_2_top / 2){
                for(let i = 0; i < conAll.length; i++){
                    conAll[i].classList.add('con_active');
                }
            }
        }

        window.addEventListener('scroll', handleScroll);

    </script>

</body>
</html>
