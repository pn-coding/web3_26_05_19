<head>

    <title>Document</title>
    <script>

        // *switch ~ case
        // =>if문과 다른 조건문 
        // =>break는 조건이 만족했을떄 밑에 조건식이 실행되지않음
        // =>default는 case에 원하는 조건이 없을때 실행
        
        // switch(조건){
        //     case 조건1: 출력값
        //     break;
        //     case 조건2: 출력값
        //     break;
        //     case 조건3: 출력값
        //     break;
        //     default: 조건이 없을때 출력 
        // }

        const num = 10;

        switch(num){
            case 1:
                console.log("입력한 값은 1입니다");
                break;
            case 2:  
                console.log("입력한 값은 2입니다");
                break;
            case 3:  
                console.log("입력한 값은 3입니다");
                break;
            default:
                console.log('원하는 값이 없습니다');
        }

    </script>
