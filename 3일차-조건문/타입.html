<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        // *기본타입
        // =>number: 숫자 
        // =>string: 문자
        // =>boolean: 참 / 거짓
        // =>NaN: Not a Number
        // =>null: 값이 없음
        // =>undefined: 정의되지 않음 

        const num_1 = 10;
        const text = 'js';
        const bool = false;
        const un = undefined;
        let un_2;

        // *typeof()
        // =>어떤 타입인지 확인할때 사용하는 메서드(함수)

        console.log(typeof(num_1));
        console.log(typeof(text));
        console.log(typeof(bool));
        console.log(typeof(un));
        console.log(typeof(un_2));


    </script>
</head>
<body>
    
</body>
</html>
