<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        // *문제1
        // 반복문을 사용하여 5단 구구단 출력
        // 출력결과)
        // 5단
        // 5 x 1 = 5
        // 5 x 2 = 10
        // 5 x 3 = 15
        // ...생략
        // 5 x 9 = 45

        // *문제2
        // 입력한 숫자의 구구단이 출력되게 만들기

        // *문제3
        // =>입력한 숫자가 홀수면 홀수단 만 출력
        // 짝수면 짝수 단 만 출력
        // ex)
        // 입력한값이 2라면
        // 2단
        // 2 x 2 = 2
        // 2 x 4 = 8
        // 2 x 6 = 12
        // 2 x 8 = 16

        // document.write("5단<br>");
        // for(let i = 1; i < 10; i++){
        //     document.write("5 x " + i + "=" + (5 * i) + "<br>");
        // }


        const num = Number(prompt("숫자를 입력해주세요"));
        const result = num % 2;

        if(result === 0){
            document.write(`${num}단<br>`);
            for(let i = 2; i < 10; i += 2){
                document.write(`${num} x ${i} = ${num * i} <br>`);
            }
        }else if(result === 1){
            document.write(`${num}단<br>`);
            for(let i = 1; i < 10; i += 2){
                document.write(`${num} x ${i} = ${num * i} <br>`);
            }
        }

        
        


    </script>
</head>

</body>
</html>
