<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

    <style>
        .swiper {
            width: 1000px;
            height: 600px;
            font-size: 50px;
        }
    </style>
</head>
<body>
    
    <!-- Slider main container -->
    <div class="swiper">
        <!-- Additional required wrapper -->
        <div class="swiper-wrapper">
            <div class="swiper-slide">
                <img src="https://unblast.com/wp-content/uploads/2021/01/Space-Background-Images.jpg" alt="">
            </div>
            <div class="swiper-slide">
                <img src="https://www.shutterstock.com/blog/wp-content/uploads/sites/5/2020/07/trendy-background-ideas-cover.jpg" alt="">
            </div>
            <div class="swiper-slide">
                <img src="https://cdn.pixabay.com/photo/2025/04/02/18/48/background-9509852_1280.jpg" alt="">
            </div>
        </div>
        <!-- If we need pagination -->
        <div class="swiper-pagination pagination"></div>
    
        <!-- If we need navigation buttons -->
        <div class="swiper-button-prev prev"></div>
        <div class="swiper-button-next next"></div>
    
        <!-- If we need scrollbar -->
        <!-- <div class="swiper-scrollbar"></div> -->
    </div>

<script>
    const swiper = new Swiper('.swiper', {
        
        // Optional parameters
        loop: true,

        // If we need pagination
        pagination: {
            el: '.pagination',
        },

        // Navigation arrows
        navigation: {
            nextEl: '.next',
            prevEl: '.prev',
        },

        // And if we need scrollbar
        // scrollbar: {
        //     el: '.swiper-scrollbar',
        // },
    });
</script>

</body>
</html>
