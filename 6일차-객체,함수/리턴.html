<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        // *리턴
        // =>함수 내부에서 특정값을 반홤함
        // =>값 반환뿐 아니라 코드를 종료할때도 사용함
        // =>리턴 뒤에 코드를 작성하면 코드가 실행되지 않음(종료 선언)
        // =>리턴하는 값이 줄바꿈되어야될땐 ()소괄호를 이용하여 사용 

        const plus = (a, b) => {
            return a + b;
        }

        const result = plus(3,7);
        console.log(result);
        

    </script>
</head>
<body>
    
</body>
</html>
