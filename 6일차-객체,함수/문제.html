        // *문제2

        // 출력결과
        // 이름: 이정환

        // 취미: 영화보기 

        const inputName = prompt("이름을 입력해주세요");
        const inputLan = prompt("좋아하는 언어를 입력해주세요");
        const inputHobby = prompt("취미를 입력해주세요");

        const userInfo = {
            name: inputName,
            language: inputLan,
            hobby: inputHobby,
            intro: function(){
                document.write(`<h2>이름: ${this.name}</h2>`);
                document.write(`<h2>좋아하는 언어: ${this.language}</h2>`);
                document.write(`<h2>취미: ${this.hobby}</h2>`);
            }
        }

        userInfo.intro();
