<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        // *객체(Object)
        // =>배열과 비슷하게 여러 속성을 저장할 수 있지만,
        // 객체는 조금더 상세한 값을 저장 할 수 있음 
        // =>{} 중괄호 사용
        // =>속성(property): 값(value) 으로 구분 
        // =>객체 안의 함수를 메서드라고 함 

        // *접근 연산자(점 표기법)
        // =>객체 내부에 속성을 접근할때 사용 
        
        // *this
        // =>객체 내부에 객체명을 한번더 선택할때 사용

        
        const obj = {
            name: 'js', 
            week: '목', 
            day: 27,
            age: 23,
            intro: function(){
                console.log(`이름: ${this.name}, 나이: ${this.age}`);
            }
        };

        obj.intro();

        // console.log(obj.day + obj.age);

        // console.log(`이름: ${obj.name}`);
        // console.log(`요일: ${obj.week}요일`);
        // console.log(`날짜: ${obj.day}일`);
        // console.log(`나이: ${obj.day}살`);


    </script>
